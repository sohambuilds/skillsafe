[project]
name = "sohamiclr"
version = "0.1.0"
description = "Skill Optimization Safety Drift — PoC"
readme = "README.md"
requires-python = ">=3.12"

# Cross-platform. Everything here works on the Windows authoring box and on the
# Linux GPU server. Nothing in this group needs a GPU.
dependencies = [
    "datasets>=2.19,<4",
    "huggingface-hub>=0.24",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "openai>=1.40",            # client for both the local vLLM server and OpenRouter
    "transformers>=4.44",      # tokenizers only, for inert length-matching
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Linux + CUDA only. Install on the GPU server with:  uv sync --extra gpu
#
# torch is deliberately NOT listed. vLLM pins an exact torch and ships a C++ extension
# compiled against that exact build; adding an independent torch constraint is one more
# way to end up with `_C.abi3.so: undefined symbol: _ZNR5torch7Library4_def...`, which
# is what a vLLM/libtorch ABI mismatch looks like from the outside. Let vLLM choose.
# EXACT pin, not a floor. The inference engine is part of the apparatus: section 5
# requires max_num_seqs, batch size and decoding to be fixed across every run, and a
# `uv sync` that silently moves vLLM between the Day 1 gates and the Day 2 sweep
# invalidates the gates exactly as changing max_num_seqs would. 0.28.0 is the version
# every gate in logs/ was measured under; it is recorded on each rollout and reported
# by src/judge.py's constraint probe, so a mismatch is detectable after the fact.
#
# Two things below 0.12 break outright, and they are why the floor moved before the pin
# did: src/serve.py emits the current CLI, where per-request logging is opt-in and
# --disable-log-requests no longer exists; and src/judge.py sends the structured-output
# request field that REPLACED the flat guided_* fields when they were removed in
# v0.12.0. On an older vLLM that field is silently ignored -- unknown request fields
# still return 200 -- and the judge decodes unconstrained.
#
# To move it: change the number, `uv sync --extra gpu` (NOT bare `uv sync`, which
# prunes this whole extra out of the venv), re-run the Day 1 gates, and say so in
# FINDINGS.md. Do not move it mid-experiment.
gpu = [
    "vllm==0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
# Resolve the lock for the Linux server only. Without this, `uv lock` run from the
# Windows authoring box tries to find Windows wheels for vllm/torch and fails.
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
